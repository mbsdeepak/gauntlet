id: single_tool_read
capability: single-tool-use
tags: [read, baseline]
prompt: >
  Read the file config/app.yaml and tell me the value of the `region` line.
tools:
  - read_file
initial_state:
  files:
    config/app.yaml: |
      region: us-east-1
      replicas: 3
graders:
  - kind: trajectory
    required_tools: [read_file]
    required_args:
      read_file: {path: config/app.yaml}
scripted:
  - text: "I'll read the config file."
    tool_calls:
      - id: t1
        name: read_file
        arguments: {path: config/app.yaml}
  - text: "The region is us-east-1."
