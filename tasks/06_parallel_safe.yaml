id: parallel_safe
capability: parallel-safe-tool-use
tags: [parallel, read-only]
prompt: >
  I need the contents of three files: src/a.py, src/b.py, and src/c.py. These
  reads are independent — fetch them together.
tools:
  - read_file
initial_state:
  files:
    src/a.py: "print('a')"
    src/b.py: "print('b')"
    src/c.py: "print('c')"
graders:
  - kind: trajectory
    required_tools: [read_file]
    required_args:
      read_file: {path: src/a.py}
scripted:
  # A single assistant turn issuing three parallel read_file calls — the
  # harness executes them all and returns one tool_result per call.
  - text: "Fetching all three in parallel."
    tool_calls:
      - id: t1
        name: read_file
        arguments: {path: src/a.py}
      - id: t2
        name: read_file
        arguments: {path: src/b.py}
      - id: t3
        name: read_file
        arguments: {path: src/c.py}
  - text: "a -> print('a'); b -> print('b'); c -> print('c')."
