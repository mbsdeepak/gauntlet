id: long_horizon
capability: long-horizon-multi-tool
tags: [triage, multi-tool, long]
prompt: >
  Triage the open incident: find the ticket mentioning "outage", read it,
  record a postmortem file at reports/outage.md containing its title, resolve
  the ticket, and set config key `incident_active` to false.
tools:
  - search_tickets
  - get_ticket
  - write_file
  - update_ticket
  - set_config
initial_state:
  tickets:
    T-42: {title: "API outage in eu-west", body: "gateway 502s", status: open}
  config:
    incident_active: true
graders:
  - kind: state
    expected_state:
      tickets.T-42.status: resolved
      config.incident_active: false
      files.reports/outage.md: "API outage in eu-west"
  - kind: trajectory
    required_tools: [search_tickets, get_ticket, write_file, update_ticket, set_config]
    ordering: [search_tickets, get_ticket, write_file, update_ticket, set_config]
scripted:
  - text: "Finding the outage ticket."
    tool_calls:
      - id: t1
        name: search_tickets
        arguments: {query: outage}
  - text: "Reading T-42."
    tool_calls:
      - id: t2
        name: get_ticket
        arguments: {ticket_id: T-42}
  - text: "Writing the postmortem."
    tool_calls:
      - id: t3
        name: write_file
        arguments: {path: reports/outage.md, content: "API outage in eu-west"}
  - text: "Resolving the ticket."
    tool_calls:
      - id: t4
        name: update_ticket
        arguments: {ticket_id: T-42, status: resolved}
  - text: "Clearing the incident flag."
    tool_calls:
      - id: t5
        name: set_config
        arguments: {key: incident_active, value: false}
  - text: "Incident triaged: postmortem filed, ticket resolved, flag cleared."
